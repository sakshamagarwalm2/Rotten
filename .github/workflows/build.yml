name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Postbuild
        run: npm run postbuild

      - name: Build Electron app
        run: npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotten-Windows-Installer
          path: dist\*.exe
          compression-level: 0

      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotten-Windows-Portable
          path: dist\win-unpacked
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Rotten-Windows-Installer
          path: release

      - name: Determine release details
        id: details
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "release_name=Rotten ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            CHANGES=$(git log --oneline $(git tag --sort=-creatordate | head -2 | tail -1)..HEAD 2>/dev/null || echo "- Initial release")
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "release_name=Rotten nightly (${{ github.sha }})" >> $GITHUB_OUTPUT
            CHANGES=$(git log --oneline $(git rev-list --max-parents=0 HEAD)..HEAD 2>/dev/null | tail -20 || echo "- Initial release")
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Rotten - Doc to PPT Converter" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Automated build from commit ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Changes" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Delete previous nightly release
        if: steps.details.outputs.is_tag != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "nightly" --yes --repo ${{ github.repository }} 2>/dev/null || true
          git push --delete origin "refs/tags/nightly" 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.details.outputs.release_name }}
          tag_name: ${{ steps.details.outputs.is_tag == 'true' && github.ref_name || 'nightly' }}
          body: ${{ steps.details.outputs.notes }}
          files: release/*.exe
          draft: false
          prerelease: ${{ steps.details.outputs.is_tag != 'true' }}
