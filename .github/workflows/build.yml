name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Postbuild
        run: npm run postbuild

      - name: Build Electron app
        run: npx electron-builder --win --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotten-Windows-Installer
          path: dist\*.exe
          compression-level: 0

      - name: Upload unpacked artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rotten-Windows-Portable
          path: dist\win-unpacked
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: Rotten-Windows-Installer
          path: release

      - name: Generate release notes
        id: notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Rotten - Doc to PPT Converter" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Automated build from commit ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Changelog" >> $GITHUB_OUTPUT
          git log --oneline $(git tag --sort=-creatordate | head -2 | tail -1)..HEAD 2>/dev/null || echo "- Initial release" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rotten ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: release/*.exe
          draft: false
          prerelease: false
